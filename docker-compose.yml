version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=http://localhost:5000
        - REACT_APP_UPLOADS_URL=http://localhost:5000/static/uploads
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - REACT_APP_UPLOADS_URL=http://localhost:5000/static/uploads
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/static/uploads:/app/static/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "python init_db.py && gunicorn --bind 0.0.0.0:5000 run:app"

volumes:
  postgres_data: 